<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 背景圆形 - 渐变色 -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="paperGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f0f0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 圆形背景 -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGradient)"/>
  
  <!-- 文档/纸张图标 -->
  <g transform="translate(28, 22)">
    <!-- 纸张主体 -->
    <rect x="0" y="0" width="32" height="42" rx="2" fill="url(#paperGradient)" stroke="#667eea" stroke-width="1.5"/>
    
    <!-- 折角 -->
    <path d="M 32 0 L 32 10 L 22 0 Z" fill="#d0d0d0" stroke="#667eea" stroke-width="1"/>
    
    <!-- 文字线条 -->
    <line x1="6" y1="12" x2="26" y2="12" stroke="#667eea" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="18" x2="22" y2="18" stroke="#764ba2" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="24" x2="24" y2="24" stroke="#667eea" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="30" x2="20" y2="30" stroke="#764ba2" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- 发布/上传箭头 -->
  <g transform="translate(62, 58)">
    <!-- 圆形背景 -->
    <circle cx="8" cy="8" r="10" fill="#fbbf24" stroke="#f59e0b" stroke-width="1.5"/>
    <!-- 向上箭头 -->
    <path d="M 8 4 L 8 12 M 8 4 L 5 7 M 8 4 L 11 7" 
          stroke="#ffffff" 
          stroke-width="2" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none"/>
  </g>
</svg>
